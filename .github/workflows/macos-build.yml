# Build/install smoke test for macOS (Apple Silicon).
# Mirrors .github/workflows/run-tests.yml, with Homebrew instead of apt.

name: Build for macOS

# Drop permissions to minimum for security
permissions:
  contents: read

on:
  pull_request:
  push:
  schedule:
    - cron: '0 2 * * 5'  # Every Friday at 2am

jobs:
  checks:
    name: Build for macOS
    timeout-minutes: 30
    runs-on: macos-14  # Apple Silicon (arm64); Homebrew lives in /opt/homebrew
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python (Homebrew)
      run: |
        brew install python
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: Install dependencies (Homebrew)
      run: |
        brew install gtk+3 pygobject3 gtksourceview4 librsvg \
                     gst-python adwaita-icon-theme gettext stockfish

    - name: Create venv and install Python dependencies
      run: |
        set -x
        python3 -m venv --system-site-packages .venv
        source .venv/bin/activate
        pip3 install -U pip setuptools wheel
        pip3 install -r requirements.txt

    - name: Install from sources
      run: |
        set -x
        source .venv/bin/activate
        python3 --version

        # Both scripts import pychess from the source tree, so they need
        # PYTHONPATH=lib, exactly as on Linux and Windows.
        PYTHONPATH=lib python3 pgn2ecodb.py
        PYTHONPATH=lib python3 create_theme_preview.py

        # workaround for pip >=25.3, creates file "learn/puzzles/mate_in_4.sqlite"
        python3 setup.py --version

        # Also exercises the gettext/msgfmt fallback added for macOS.
        pip3 install -e .

    - name: Smoke test
      run: |
        set -x
        source .venv/bin/activate

        # GTK and its typelibs must be importable
        python3 -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('GTK', Gtk.MAJOR_VERSION, Gtk.MINOR_VERSION)"

        # The pychess package must be importable
        python3 -c "import pychess; print('pychess import OK')"

        # Running the installed launcher exercises the macOS libintl lookup that
        # used to abort startup on Apple Silicon (it only looked under /usr/local).
        pychess --help
