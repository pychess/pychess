#
# Build/install smoke test for macOS. The full GTK stack is exercised on
# Apple Silicon; a lightweight Intel job verifies the architecture-specific
# Homebrew gettext/libintl lookup without forcing Homebrew to build GTK from
# source on Intel runners.

name: Build for macOS

# Drop permissions to minimum for security
permissions:
  contents: read

on:
  pull_request:
  push:
  schedule:
    - cron: '0 2 * * 5'  # Every Friday at 2am

jobs:
  checks:
    name: Build for macOS (Apple Silicon)
    timeout-minutes: 30
    runs-on: macos-14
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python (Homebrew)
      run: |
        brew install python
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: Install dependencies (Homebrew)
      run: |
        brew install gtk+3 pygobject3 gtksourceview4 librsvg \
                     gstreamer adwaita-icon-theme gettext stockfish

    - name: Create venv and install Python dependencies
      run: |
        set -x
        python3 -m venv --system-site-packages .venv
        source .venv/bin/activate
        pip3 install -U pip setuptools wheel
        pip3 install -r requirements.txt

    - name: Install from sources
      run: |
        set -x
        source .venv/bin/activate
        python3 --version

        # Both scripts import pychess from the source tree, so they need
        # PYTHONPATH=lib, exactly as on Linux and Windows.
        PYTHONPATH=lib python3 pgn2ecodb.py
        PYTHONPATH=lib python3 create_theme_preview.py

        # workaround for pip >=25.3, creates file "learn/puzzles/mate_in_4.sqlite"
        python3 setup.py --version

        # Homebrew's gettext is keg-only, so setup.py must find msgfmt in the
        # formula's opt prefix rather than relying on it being on PATH.
        pip3 install -e .

    - name: Smoke test
      run: |
        set -x
        source .venv/bin/activate

        # GTK and its typelibs must be importable.
        python3 -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('GTK', Gtk.MAJOR_VERSION, Gtk.MINOR_VERSION)"

        # The pychess package must be importable.
        python3 -c "import pychess; print('pychess import OK')"

        # Exercise the same libintl loader used by the launcher.
        PYTHONPATH=lib python3 -c "from pychess.System.libintl import load_libintl; assert load_libintl() is not None; print('libintl OK')"

        # Basic launcher smoke test. argparse exits before GUI startup.
        pychess --help

  intel-libintl:
    name: libintl smoke test (Intel)
    timeout-minutes: 10
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install gettext (Homebrew)
      run: brew install gettext

    - name: Test Intel Homebrew libintl lookup
      run: |
        set -x
        test -f "$(brew --prefix gettext)/lib/libintl.dylib"
        PYTHONPATH=lib python3 -c "from pychess.System.libintl import load_libintl; assert load_libintl() is not None; print('libintl OK')"
